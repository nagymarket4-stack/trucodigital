name: Autopiloto diario

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC (07:17 en España en verano)
  workflow_dispatch:
    inputs:
      articles:
        description: "Nº de artículos a generar con la API (0 = solo vídeos, subidas y web)"
        default: "5"
  push:
    branches: [main]
    paths: ["content/**", "bot/**", "config.json", "static/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autopiloto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      SITE_URL: ${{ vars.SITE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            data/voices
            data/emoji
          key: media-cache-v1-${{ github.run_id }}
          restore-keys: media-cache-v1-

      - name: Generar artículos (API de Claude)
        if: github.event_name != 'push' && github.event.inputs.articles != '0'
        run: python bot/generate.py ${{ github.event.inputs.articles || '' }} || echo "::warning::generación con fallos"

      - name: Vídeos, subidas y web
        run: |
          python bot/video.py || echo "::warning::vídeo con fallos"
          python bot/upload_youtube.py || echo "::warning::YouTube con fallos"
          python bot/upload_tiktok.py || echo "::warning::TikTok con fallos"
          python bot/build.py

      - name: Guardar estado en el repo
        run: |
          git config user.name "autopiloto-bot"
          git config user.email "autopiloto-bot@users.noreply.github.com"
          git add content data/keywords.txt data/keywords_used.txt
          git diff --cached --quiet || git commit -m "contenido: $(date -u +%F) [skip ci]"
          git pull --rebase --autostash && git push

      - name: Vídeos del día (descargables)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: videos/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pillow requests && python bot/indexnow.py
