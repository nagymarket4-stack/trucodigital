name: Autopiloto diario

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC (07:17 en España en verano)
  workflow_dispatch:
    inputs:
      articles:
        description: "Nº de artículos a generar (0 = solo reconstruir la web)"
        default: "5"
  push:
    branches: [main]
    paths: ["content/**", "bot/build.py", "config.json", "static/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autopiloto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/voices
          key: piper-voices-v1

      - name: Pipeline completo (artículos, vídeos, subidas, web)
        if: github.event_name != 'push'
        run: |
          N="${{ github.event.inputs.articles }}"
          if [ "$N" = "0" ]; then
            python bot/video.py; python bot/upload_youtube.py; python bot/upload_tiktok.py; python bot/build.py
          else
            sed -i "s/\"articles_per_day\": [0-9]*/\"articles_per_day\": ${N:-5}/" config.json
            python bot/pipeline.py
            git checkout config.json
          fi

      - name: Solo reconstruir la web
        if: github.event_name == 'push'
        run: python bot/build.py

      - name: Guardar artículos nuevos en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "autopiloto-bot"
          git config user.email "autopiloto-bot@users.noreply.github.com"
          git add content data/keywords.txt data/keywords_used.txt
          git diff --cached --quiet || git commit -m "contenido: $(date -u +%F) [skip ci]"
          git push

      - name: Vídeos del día (descargables)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: videos/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
